services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris_dev_password}
      POSTGRES_DB: iris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 3s
      retries: 10

  iris-core:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://iris:${POSTGRES_PASSWORD:-iris_dev_password}@postgres:5432/iris
      WORKSPACE_DIR: /app/workspace
      TELEGRAM_MCP_URL: http://telegram-mcp:8100/mcp
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn iris.api:app --host 0.0.0.0 --port 8000

  telegram-mcp:
    build: ./mcp_servers/telegram
    env_file: .env
    environment:
      IRIS_CORE_URL: http://iris-core:8000
      HOST: 0.0.0.0
      PORT: 8100
      OWNER_FILE: /app/data/owner.json
    volumes:
      - ./mcp_servers/telegram/data:/app/data
    depends_on:
      - iris-core
    ports:
      - "8100:8100"

  dashboard:
    build: ./dashboard
    env_file: .env
    environment:
      WORKSPACE_DIR: /app/workspace
      POSTGRES_DSN: postgresql+psycopg://iris:${POSTGRES_PASSWORD:-iris_dev_password}@postgres:5432/iris
      IRIS_API_URL: http://iris-core:8000
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - iris-core
    ports:
      - "8080:8080"

volumes:
  pgdata:
