services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris_dev_password}
      POSTGRES_DB: iris
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 3s
      retries: 10

  iris-core:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+psycopg://iris:${POSTGRES_PASSWORD:-iris_dev_password}@postgres:5432/iris
      # The image runs as uid 10001 and expects its data under /data, so the
      # host workspace mounts there rather than at /app/workspace. On Linux the
      # host directory must be writable by that uid:
      #   sudo chown -R 10001:10001 ./workspace
      WORKSPACE_DIR: /data/workspace
      TELEGRAM_MCP_URL: http://telegram-mcp:8100/mcp
      # The bridge persists the owner chat id it learns from /start. Share that
      # file with the core, otherwise `_sync_owner_chat_id` can never find it
      # inside the container and morning briefs / scheduled-task delivery stay
      # silent unless OWNER_CHAT_ID is pinned in the environment.
      OWNER_FILE: /app/telegram-data/owner.json
    volumes:
      - ./workspace:/data/workspace
      - ./mcp_servers/telegram/data:/app/telegram-data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Internal service: the Telegram bridge and local tools call it.
      # Bound to loopback so `docker compose up` never exposes an
      # auth-disabled API to the network.
      - "127.0.0.1:8000:8000"
    command: uvicorn iris.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  telegram-mcp:
    # Root context: the bridge imports the library (`iris.channels.*`), so the
    # image needs the package source. See mcp_servers/telegram/Dockerfile.
    build:
      context: .
      dockerfile: mcp_servers/telegram/Dockerfile
    env_file: .env
    environment:
      IRIS_CORE_URL: http://iris-core:8000
      HOST: 0.0.0.0
      PORT: 8100
      OWNER_FILE: /app/data/owner.json
    volumes:
      - ./mcp_servers/telegram/data:/app/data
    depends_on:
      iris-core:
        condition: service_healthy
    ports:
      # Internal service (MCP server for iris-core) — loopback only.
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;socket.create_connection(('127.0.0.1',8100),3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
