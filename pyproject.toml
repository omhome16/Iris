[project]
name = "iris-personal-ai"
# Single-sourced: the version lives in `src/iris_ai/__init__.py` (what `iris version`
# prints) and hatch reads it from there, so the two cannot drift. See
# DOCS.md ("Testing and CI") for the release discipline.
dynamic = ["version"]
description = "Iris — a neutral, plug-and-play agent harness"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Iris contributors" }]
keywords = ["llm", "agents", "agent-harness", "memory", "rag", "personal-assistant", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.60",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "textual>=1.0",
    # Windows has no system time-zone database. Without this, ZoneInfo("UTC")
    # raises on every chat turn.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
iris = "iris_ai.cli.main:app"
# The editor surface: the process an ACP client (Zed, JetBrains, …) spawns.
# It is a separate script because it is a separate *interface*, not a subcommand
# — an editor connects to a stdio endpoint, not to `iris <verb>`.
iris-acp = "iris_ai.interfaces.acp.serve:main"

[project.urls]
Homepage = "https://github.com/omhome16/Iris"
Repository = "https://github.com/omhome16/Iris"
Issues = "https://github.com/omhome16/Iris/issues"
Changelog = "https://github.com/omhome16/Iris/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
mcp = [
    "mcp>=2.0",
]
schedule = [
    "apscheduler>=3.10",
]
judge = [
    "typesafe-sdk>=0.5.7",
]
secrets = [
    "keyring>=25",
]
acp = [
    "agent-client-protocol>=0.12.1",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]
all = [
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.0",
    "apscheduler>=3.10",
    "typesafe-sdk>=0.5.7",
    "keyring>=25",
    "agent-client-protocol>=0.12.1",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/iris_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/iris_ai"]
# The shipped skills live at the repo root for contributors to read. Without
# this mapping they are absent from the wheel, and `iris skills list` on an
# installed copy would quietly lose the builtin that the README advertises.

[tool.hatch.build.targets.wheel.force-include]
"skills" = "iris_ai/builtin_skills"
"assets/mermaid" = "iris_ai/assets/mermaid"
"src/iris_ai/eval/suites" = "iris_ai/eval/suites"

[tool.uv]
package = true
# urllib3 2.7.0 has CVE-2026-97687, CVE-2026-97688, and CVE-2026-97689.
constraint-dependencies = ["urllib3>=2.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts", "mcp_servers"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports/variables
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear: mutable defaults, bug-prone patterns
    "UP",  # pyupgrade: dead syntax for the target version
    "C4",  # comprehensions
    "SIM", # simplifiable code
    "RUF", # ruff-specific
    "BLE", # blind except: every broad `except` must carry an explicit justification
]
ignore = [
    "E501",   # line length is a formatter concern; 120 is enforced where it matters
    "B008",   # FastAPI's Depends()/Query() idiom is a call in a default
    "RUF001", # ambiguous unicode (em dashes in docstrings are intentional)
    "RUF002",
    "RUF003",
    "RUF012", # ClassVar annotations add noise to these small config-ish classes
    "SIM108", # ternaries are not always clearer than an if/else
    "UP042",  # str-Enum mixins (`Origin`, `GuardAction`) are serialized into
              # Postgres and read back as plain strings; StrEnum changes `str()`
              # behaviour and the DB/ledger layer depends on today's shape.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]    # imports after sys.path/dir setup where needed
"scripts/*" = ["E402"]  # .env loading must precede the iris imports
