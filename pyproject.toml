[project]
name = "iris"
version = "0.1.0"
description = "Iris — a personal AI assistant with a visible mind (memory engineering, agent graphs, context engineering)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.60",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=2.0",
    "apscheduler>=3.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typesafe-sdk>=0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "scripts", "mcp_servers", "dashboard"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: undefined names, unused imports/variables
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear: mutable defaults, bug-prone patterns
    "UP",  # pyupgrade: dead syntax for the target version
    "C4",  # comprehensions
    "SIM", # simplifiable code
    "RUF", # ruff-specific
    "BLE", # blind except: every broad `except` must carry an explicit justification
]
ignore = [
    "E501",   # line length is a formatter concern; 120 is enforced where it matters
    "B008",   # FastAPI's Depends()/Query() idiom is a call in a default
    "RUF001", # ambiguous unicode (em dashes in docstrings are intentional)
    "RUF002",
    "RUF003",
    "RUF012", # ClassVar annotations add noise to these small config-ish classes
    "SIM108", # ternaries are not always clearer than an if/else
    "UP042",  # str-Enum mixins (`Origin`, `GuardAction`) are serialized into
              # Postgres and read back as plain strings; StrEnum changes `str()`
              # behaviour and the DB/ledger layer depends on today's shape.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]    # imports after sys.path/dir setup where needed
"scripts/*" = ["E402"]  # .env loading must precede the iris imports
