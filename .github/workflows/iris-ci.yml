name: Iris CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_dev_password
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris -d iris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRIS_TEST_POSTGRES_DSN: postgresql+psycopg://iris:iris_dev_password@localhost:5432/iris_test
      IRIS_EVAL_POSTGRES_DSN: postgresql+psycopg://iris:iris_dev_password@localhost:5432/iris_eval
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Create eval database
        run: docker exec "${{ job.services.postgres.id }}" psql -U iris -d iris -c "CREATE DATABASE iris_eval;"

      - name: Test suite (pytest)
        run: uv run pytest tests -q

      - name: Eval lab (recall ablation study)
        run: uv run python scripts/eval_lab.py