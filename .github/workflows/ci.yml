name: CI

# Iris previously had no CI at all — "lint passes" was unmeasurable and the
# memory pipeline's integration tests (the ones that need real pgvector) had
# never run anywhere but a laptop. This workflow is the gate: lint, the full
# test suite against a real Postgres+pgvector service, and a production image
# build so a broken Dockerfile is caught on the PR rather than at deploy time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach a paid provider or a real workspace. Ollama is not
  # running in CI either, so model calls are exercised through fakes only and
  # anything that would hit the network fails loudly instead of silently.
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://127.0.0.1:1
  IRIS_API_TOKEN: ci-token

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .

  retrieval:
    # Two-speed gating: deterministic retrieval metrics on every change, judge
    # suites (which need a key, a budget and a calibration study before their
    # numbers mean anything) later. This job is the first speed, and it is
    # deliberately the cheap one — a labelled fixture scored with recall@k and
    # nDCG@k against a real pgvector index, with no model call anywhere. It has
    # its own slot rather than a step in `test` so a ranking regression names
    # itself in the checks list instead of hiding inside a 900-test run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_dev_password
          POSTGRES_DB: iris
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      IRIS_EVAL_POSTGRES_DSN: postgresql+psycopg://iris:iris_dev_password@localhost:5433/iris_eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra postgres
      # No `CREATE DATABASE` step: `iris_eval` is the gate's *scratch* corpus
      # database, and the fixture creates it on demand (`tests/db.py`). Reaching
      # into the service container to make it was the fragile half of this job —
      # and it was only ever needed because a service container never runs
      # postgres/init.sql.
      - name: Retrieval gate (labelled fixture, no model)
        run: uv run pytest tests/test_retrieval_gate.py tests/test_retrieval_metrics.py -q

  package:
    # "The wheel builds" is a claim about the artifact, not about pyproject.toml.
    # Build it, install it into a clean venv, and run the console entry from the
    # installed copy — so a broken build or a missing entry point fails here
    # rather than on someone's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build
      - name: Install the wheel and run the console entry
        run: |
          python -m venv /tmp/iris-venv
          /tmp/iris-venv/bin/pip install --quiet dist/*.whl
          /tmp/iris-venv/bin/iris version
          /tmp/iris-venv/bin/iris --help
          # From /tmp, so repo-root `skills/` is NOT on the path: this asserts the
          # builtin skill resolves out of the *packaged* copy, which is the bug
          # that made `iris skills list` empty on an installed wheel.
          cd /tmp && /tmp/iris-venv/bin/iris skills list | grep -q web-page-to-notes

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the memory index uses `vector` columns and an HNSW
        # index, so a plain postgres image cannot run these tests.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_dev_password
          POSTGRES_DB: iris
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_DSN: postgresql+psycopg://iris:iris_dev_password@localhost:5433/iris
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `--all-extras` on purpose: the ACP adapter and the OTLP exporter are
      # optional for the *harness* and required for their own tests, and a plain
      # `uv sync` would turn Phase 6's gate into twelve skips that CI reports as
      # green. The extras are what the project advertises, so CI installs what the
      # project advertises and runs the tests that prove it works.
      - run: uv sync --frozen --all-extras
      # No `CREATE DATABASE` steps: `iris_test` and `iris_eval` are the suite's own
      # *scratch* databases (the first is deliberately separate from real memory,
      # the second is the eval corpus), and both fixtures create them on demand
      # (`tests/db.py`). The pgvector service only creates POSTGRES_DB, and
      # reaching into it from here was the fragile half of this job.
      - name: Unit + integration tests
        # The DB-backed suite is included here on purpose: locally those tests
        # fail loudly when no Postgres is listening (they do not skip), so on a
        # laptop they only run when someone starts the container by hand —
        # which is how they stayed dark. CI is where they always run.
        run: uv run pytest tests -q

  onboarding:
    # Phase 2's gate: the five-minute claim, timed on a clean checkout — and
    # deliberately with **no Postgres service in this job**, because "no daemon"
    # is half of what is being claimed. `iris init` is expected to succeed
    # against the SQLite defaults; if it ever needs a database again, this job
    # fails here instead of passing quietly inside a service-enabled `test` run.
    #
    # There is no provider key in CI (`LLM_PROVIDER=ollama`, dead
    # `OLLAMA_BASE_URL`), so the reply comes from the suite's deterministic model
    # double rather than a network call. That is the stronger check: it proves the
    # *engine* answers without a service, where a live key would mask a boot that
    # could not. `--offline` skips init's two live probes for the same reason;
    # the probes themselves are covered by `tests/test_onboarding.py`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Clean-checkout path (install + init + a reply), timed
        run: |
          set -euo pipefail
          started=$(date +%s)
          uv sync --frozen          # install from the lockfile, as the README says
          uv run iris init --offline
          # A reply with no database anywhere: the Phase 2 claims are that the
          # session boots full, keeps its threads, and still recalls a note.
          uv run pytest tests/test_harness.py -q -k no_database
          elapsed=$(( $(date +%s) - started ))
          echo "clean-checkout path (install + init + reply): ${elapsed}s"
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::clean-checkout path took ${elapsed}s; the budget is 300s"
            exit 1
          fi

  security:
    # Phase 7's release discipline: a pinned lockfile is not the same as a safe
    # one. Two checks, neither of which needs a service:
    #
    # * **pip-audit** reads the *resolved* dependency set against the advisory
    #   database. Not `--strict`: that fails when a dependency cannot be audited,
    #   and `iris-personal-ai` is the local project (not on PyPI yet), so strict
    #   mode would fail every run for a reason that has nothing to do with
    #   security. It still exits non-zero on a real finding — this job earns its
    #   keep: it caught `httpx2` 2.10.0 (three advisories, fixed in 2.13.1),
    #   reached through the MCP SDK, which nothing else here would have noticed.
    #
    # * **bandit** for medium-and-up issues in `src/`. The two skipped rules are
    #   named and justified rather than left implicit: `B608` fires on the
    #   SQLite backend's f-strings, where the only interpolated text is
    #   `?` placeholders and a module-level GLOB constant (values are bound as
    #   parameters), and `B108` fires on the literal `--tmpfs /tmp:...` argument
    #   the container sandbox passes to docker. Everything else is live, so an
    #   `eval`, a `shell=True` or a weak hash added later fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Dependency audit (known CVEs)
        run: uv run --with pip-audit pip-audit --progress-spinner off
      - name: Static analysis (medium and up)
        run: uv run --with bandit bandit -r src -q -ll -s B608,B108

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: iris:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container is non-root
        # One assertion, named for what it does. It does *not* fetch /health:
        # the API keeps `postgres="require"` (see `engine.harness`), so the image
        # refuses to boot without a reachable database rather than serving a
        # half-broken one — and this job has no Postgres service. The real
        # healthcheck runs in `docker compose`, where the stack exists.
        run: |
          test "$(docker run --rm --entrypoint id iris:ci -u)" != "0"
