<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRIS — Memory Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topbar glass">
    <button class="side-toggle" id="side-toggle" aria-label="toggle sidebar" title="toggle sidebar">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">IRIS</span>
      <span class="brand-sub">memory console</span>
    </div>
    <div class="topbar-actions">
      <span class="status" id="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">connecting</span></span>
      <button class="theme-toggle" id="theme-toggle" aria-label="toggle dark mode" title="toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <aside class="sidebar glass" id="sidebar">

      <section class="side-section open" data-panel="memory">
        <button class="side-head" aria-expanded="true">
          <span class="side-icon" aria-hidden="true">◆</span>
          <span class="side-label">memory</span>
          <span class="side-count mono" id="count-chunks">—</span>
        </button>
        <div class="side-body">
          <div class="file-tabs" role="tablist">
            <button class="file-tab active" data-file="memory" role="tab">MEMORY.md</button>
            <button class="file-tab" data-file="user" role="tab">USER.md</button>
          </div>
          <pre class="file-body mono" id="file-body">loading…</pre>
          <div class="side-meta mono" id="memory-meta">—</div>
        </div>
      </section>

      <section class="side-section" data-panel="dreams">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">☾</span>
          <span class="side-label">dreams</span>
          <span class="side-count mono" id="count-flags">—</span>
        </button>
        <div class="side-body">
          <div class="side-toolbar">
            <button class="action" id="sleep-btn">run dream cycle</button>
            <span class="side-meta mono">flags <span id="flags-num">—</span></span>
          </div>
          <pre class="file-body mono" id="dreams-body">loading…</pre>
        </div>
      </section>

      <section class="side-section" data-panel="decay">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">∿</span>
          <span class="side-label">decay</span>
          <span class="side-count mono" id="count-rot">—</span>
        </button>
        <div class="side-body">
          <svg id="curve" class="curve" viewBox="0 0 600 180" preserveAspectRatio="none" aria-label="retention decay curve"></svg>
          <div class="rot-list" id="rot-list"></div>
        </div>
      </section>

      <section class="side-section" data-panel="skills">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">⚙</span>
          <span class="side-label">skills</span>
          <span class="side-count mono" id="count-skills">—</span>
        </button>
        <div class="side-body">
          <div class="skill-list" id="skill-list">loading…</div>
        </div>
      </section>

      <section class="side-section" data-panel="tasks">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">◷</span>
          <span class="side-label">tasks</span>
          <span class="side-count mono" id="count-tasks">—</span>
        </button>
        <div class="side-body">
          <div class="skill-list" id="task-list">loading…</div>
        </div>
      </section>

      <section class="side-section" data-panel="spend">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">$</span>
          <span class="side-label">llm spend</span>
          <span class="side-count mono" id="count-cost">—</span>
        </button>
        <div class="side-body">
          <div class="skill-list" id="cost-list">loading…</div>
          <div class="side-meta mono" id="cost-cache"></div>
        </div>
      </section>

      <section class="side-section" data-panel="traces">
        <button class="side-head" aria-expanded="false">
          <span class="side-icon" aria-hidden="true">⤳</span>
          <span class="side-label">traces</span>
          <span class="side-count mono"></span>
        </button>
        <div class="side-body">
          <div class="skill-list" id="trace-list">loading…</div>
        </div>
      </section>

    </aside>

    <main class="main">
      <section class="card chat-card" id="conversation">
        <div class="chat-log" id="chat-log" role="log" aria-live="polite">
          <div class="msg msg-iris">
            <div class="msg-role">IRIS</div>
            <div class="msg-body">Say hello. On a fresh memory I'll ask a few questions to build your profile.</div>
          </div>
        </div>
        <form class="composer" id="composer">
          <input id="input" type="text" placeholder="Message Iris…" autocomplete="off" autofocus>
          <button type="submit" class="send" id="send-btn">send ↵</button>
        </form>
        <details class="activity" id="activity">
          <summary class="activity-toggle mono">agent activity — thinking & tool calls</summary>
          <div class="activity-body mono" id="activity-body"></div>
        </details>
        <div class="hint mono" id="hint"></div>
      </section>
    </main>

  </div>

  <footer class="colophon mono">
    <span>iris — memory engineering · agent graphs · context engineering</span>
    <span id="index-stats">index: —</span>
  </footer>

</div>
<script src="/static/app.js"></script>
</body>
</html>
