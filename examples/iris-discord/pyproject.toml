[project]
name = "iris-discord"
version = "0.1.0"
description = "Discord channel for Iris. Install beside Iris; it does not import unless you serve it."
requires-python = ">=3.12"
dependencies = ["iris-personal-ai", "discord.py"]

[project.entry-points."iris_ai.components"]
"channel.discord" = "iris_discord.channel:DiscordChannel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iris_discord"]
